name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          relay_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          relay_sdkmanager="$relay_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$relay_sdkmanager" ]; then
            relay_sdk="$RUNNER_TEMP/chat-relay-android-sdk"
            mkdir -p "$relay_sdk/cmdline-tools"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$relay_sdk/cmdline-tools"
            mv "$relay_sdk/cmdline-tools/cmdline-tools" "$relay_sdk/cmdline-tools/latest"
            relay_sdkmanager="$relay_sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$relay_sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$relay_sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$relay_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$relay_sdk" >> "$GITHUB_ENV"
          yes | "$relay_sdkmanager" --licenses > /dev/null || true
          "$relay_sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Keep the development APK signing identity between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chat-relay-debug-keystore-v1
      - name: Build and lint Android
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:lintDebug --stacktrace > build.log 2>&1
          relay_build_status=$?
          cat build.log
          if [ "$relay_build_status" -ne 0 ]; then
            python3 - <<'PYTHON'
          from pathlib import Path
          lines = Path('build.log').read_text().splitlines()
          for line in lines:
              if 'error:' in line.lower() or 'what went wrong' in line.lower() or 'failed' in line.lower() or 'sdk' in line.lower():
                  escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + escaped)
          PYTHON
          fi
          exit "$relay_build_status"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-relay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  android-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          relay_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          relay_sdkmanager="$relay_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$relay_sdkmanager" ]; then
            relay_sdk="$RUNNER_TEMP/chat-relay-android-sdk"
            mkdir -p "$relay_sdk/cmdline-tools"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$relay_sdk/cmdline-tools"
            mv "$relay_sdk/cmdline-tools/cmdline-tools" "$relay_sdk/cmdline-tools/latest"
            relay_sdkmanager="$relay_sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$relay_sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$relay_sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$relay_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$relay_sdk" >> "$GITHUB_ENV"
          yes | "$relay_sdkmanager" --licenses > /dev/null || true
          "$relay_sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/dev.chatrelay/files/ ../ui-screenshots
      - name: Report emulator test failures
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('android/app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
                  for failure in root.iter('failure'):
                      message = (failure.text or failure.get('message', 'Android UI test failed'))[:10000]
                      print('::error::' + message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
              except ET.ParseError:
                  pass
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-relay-ui-checks
          path: |
            ui-screenshots/
            android/app/build/reports/androidTests/
          retention-days: 14
